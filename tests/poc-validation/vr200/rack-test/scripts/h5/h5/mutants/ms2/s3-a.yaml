# S3 rack locality: two identical 18-pod Indexed Jobs, each pod claiming one
# whole VR200 tray (vr200-x4, 4 GPUs) with required pod affinity on
# nvidia.com/gpu.clique scoped to its own Job's pods.
#
# Apply s3-rack-a.yaml, wait until its 18 pods are Running, then apply
# s3-rack-b.yaml. Never apply both at once: two Jobs racing for one empty
# rack both take the first-pod exception and share it, so B runs partially.
# Expected: all 18 pods of A share one nvidia.com/gpu.clique value, equal to
# the vr200 SGPURack's "<fabricUUID>.0"; every pod of B stays Pending.
#
# Preconditions (each is a way S3 could pass or fail for the wrong reason):
#  P1 KWOK's pod-complete Stage is NOT installed
#     (kwok/stage-fast-v0.8.0-no-pod-complete.yaml). With it, KWOK flips every
#     Job-owned pod on a fake node to Succeeded immediately
#     (stage-fast-v0.8.0.yaml:148-187); the claim controller then drops the
#     reservation, clears the allocation and deletes the generated claim
#     (k8s v1.35.0 pkg/controller/resourceclaim/controller.go:824-826,
#     864-872, 910-925), and the scheduler stops seeing the pod at all
#     (its pod informer excludes Succeeded/Failed, pkg/scheduler/scheduler.go:651-656).
#     A's trays would free up and B would schedule; and a late pod of A that
#     finds no live pod of A takes the first-pod exception and may pick any
#     clique (interpodaffinity/filtering.go:396-404), which splits A as soon
#     as there is a second rack with room.
#  P2 No real node carries nvidia.com/gpu.clique:
#       kubectl get nodes -l 'nvml-mock/profile,nvidia.com/gpu.clique' -o name   # empty
#     A node without the topology label is never feasible
#     (filtering.go:385-393), which is what keeps A and B off the 12 free
#     real VR200 GPUs. If the real VR200 workers got a clique (GFD, or the DRA
#     chart's computeDomains gpuCliqueLabelEnabled, values.yaml:308-310), B's
#     first pod could take the first-pod exception there and B would run
#     partially (3 pods) instead of staying Pending.
#  P3 The namespace holds no other pod labelled s3-job=a or s3-job=b (delete
#     the namespace between runs). A stale matching pod pins the clique the
#     Job must use.
#  P4 S1/S2 deleted, so all 72 rack GPUs are free.
#
# Why the manifest cannot split across racks:
#  - required (not preferred) affinity: once the first pod of a Job is bound
#    or assumed, every later pod of that Job must go to a node whose clique
#    already has one (filtering.go:384-389). The scheduler places pods one at
#    a time and counts assumed pods, so the second pod already sees the first.
#  - the selector is one label unique to each Job, so B is never attracted to
#    A's rack and A is never attracted to anything else;
#  - the claim selector keeps pods off the GB300 and H100 racks, which also
#    carry a clique label;
#  - B has the same (default) priority as A, so it cannot preempt A's pods.
# What it does not give: gang scheduling. A Job whose rack has room for only
# some of its pods runs partially; here that cannot happen because the only
# rack with VR200 devices is either empty (A) or full (B), and P2 holds.
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-rack-a
  namespace: sched-test
spec:
  completionMode: Indexed
  completions: 18
  parallelism: 18
  backoffLimit: 0
  template:
    metadata:
      labels:
        mokka-hetero.nvidia.com/scenario: s3
        mokka-hetero.nvidia.com/s3-job: a
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 0
      tolerations:
      - key: kwok.x-k8s.io/node
        operator: Exists
        effect: NoSchedule
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                mokka-hetero.nvidia.com/s3-job: a
            topologyKey: nvidia.com/gpu.clique
      containers:
      - name: app
        image: registry.k8s.io/pause:3.10
        imagePullPolicy: IfNotPresent
        resources:
          claims:
          - name: gpus
      resourceClaims:
      - name: gpus
        resourceClaimTemplateName: vr200-x4
