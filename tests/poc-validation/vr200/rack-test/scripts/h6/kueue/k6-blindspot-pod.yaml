# OPTIONAL probe of design (b)'s blind spot. Not managed by Kueue (namespace
# mokka-hetero-sched is outside managedJobsNamespaceSelector). It takes one
# whole VR200 tray through DRA on kwok-vr200-00.
#
# Variant "hidden" (as written): the pod requests NO accounting resource, so
# Kueue's TAS still believes kwok-vr200-00 is free (TAS subtracts only the
# requests of non-TAS pods: tas_flavor_snapshot.go:260-265). Expected when
# tas-a is then applied: Kueue ADMITS tas-a (18 trays "fit"), the pod the
# ungater pins to kwok-vr200-00 stays Pending with a DRA allocation failure,
# 17/18 run. That is the failure the accounting resource cannot catch.
#
# Variant "visible": uncomment the resources block. Expected: tas-a is NOT
# admitted, message "allows to fit only 17 out of 18 pod(s)". The pair shows
# TAS counts exactly what the accounting resource declares, nothing more.
apiVersion: v1
kind: Pod
metadata:
  name: blindspot-tray
  namespace: mokka-hetero-sched
spec:
  nodeSelector:
    kubernetes.io/hostname: kwok-vr200-00
  tolerations:
  - key: kwok.x-k8s.io/node
    operator: Exists
    effect: NoSchedule
  terminationGracePeriodSeconds: 0
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "86400"]
    resources:
      # requests:
      #   mokka-hetero.nvidia.com/tas-vr200-gpu: "4"
      # limits:
      #   mokka-hetero.nvidia.com/tas-vr200-gpu: "4"
      claims:
      - name: gpus
  resourceClaims:
  - name: gpus
    resourceClaimTemplateName: vr200-x4
