# Negative: identical to tas-a, applied only after tas-a is admitted and its 18 pods Running. Expected: Workload stays QuotaReserved=False with a TOPOLOGY message while ClusterQueue vr200 still has quota (72 of 144 used).
apiVersion: batch/v1
kind: Job
metadata:
  name: tas-b
  namespace: mokka-hetero-kueue
  labels:
    kueue.x-k8s.io/queue-name: vr200
spec:
  # Kueue's job webhook suspends a labelled Job anyway; stating it keeps the
  # Job inert if the webhook is ever bypassed.
  suspend: true
  completionMode: Indexed
  completions: 18
  parallelism: 18
  backoffLimit: 0
  template:
    metadata:
      labels:
        mokka-hetero.nvidia.com/scenario: kueue-tas
        mokka-hetero.nvidia.com/kueue-job: tas-b
      annotations:
        # kueue.x-k8s.io/podset-required-topology
        # (apis/kueue/v1beta2/topology_types.go:28): every pod in one domain of
        # this level, i.e. one rack.
        kueue.x-k8s.io/podset-required-topology: nvidia.com/gpu.clique
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 0
      tolerations:
      - key: kwok.x-k8s.io/node
        operator: Exists
        effect: NoSchedule
      containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "86400"]
        resources:
          # The accounting resource TAS counts (node allocatable, set by
          # k3-shadow-capacity.sh from each node's ResourceSlice). Extended
          # resources need limits; requests must equal them.
          requests:
            mokka-hetero.nvidia.com/tas-vr200-gpu: "4"
          limits:
            mokka-hetero.nvidia.com/tas-vr200-gpu: "4"
          # The devices themselves: one whole VR200 tray through DRA.
          claims:
          - name: gpus
      resourceClaims:
      - name: gpus
        resourceClaimTemplateName: vr200-x4
