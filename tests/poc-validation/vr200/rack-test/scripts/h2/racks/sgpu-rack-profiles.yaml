---
# HGX H100: the NVLink domain is the 8-GPU baseboard, not the rack. The CRD
# admits gpuFabric.domain.scope Node, but the control plane rejects any
# gpuFabric that is not Rack-scoped with gpuCount == nodesPerRack x count
# (materialize.go:110-123), so this profile declares no gpuFabric at all.
# The "rack" here is a placement group of 18 HGX nodes; the control plane
# still projects one nvidia.com/gpu.clique value on it
# (projection/controller.go:792-797), which for H100 names the rack, not an
# NVLink partition.
apiVersion: mokka.nvidia.com/v1alpha1
kind: SGPURackProfile
metadata:
  name: hetero-h100-hgx
spec:
  rack:
    nodesPerRack: 18
  node:
    gpus:
      count: 8                                  # h100.yaml:360-415 (8 devices)
      model:
        vendor: NVIDIA
        product: HGX H100                       # h100.yaml:1
        productName: NVIDIA H100 80GB HBM3      # h100.yaml:24
        architecture: Hopper                    # h100.yaml:33
        computeCapability:                      # h100.yaml:34-36
          major: 9
          minor: 0
        cores:
          cuda: 16896                           # h100.yaml:37
        board:
          partNumber: 699-21010-0200-000        # h100.yaml:27
        firmware:
          vbiosVersion: 96.00.74.00.09          # h100.yaml:28
          gspVersion: 550.163.01                # h100.yaml:343
          infoROM:                              # h100.yaml:57-61 (pwr_object N/A)
            imageVersion: H100.0200.00.04
            oemObjectVersion: "2.1"
            eccObjectVersion: "7.16"
      memory:
        capacity: 80Gi                          # h100.yaml:67
        reserved: 1Gi                           # h100.yaml:68
        bar1Capacity: 256Gi                     # h100.yaml:74
        busWidthBits: 5120                      # h100.yaml:71
      pci:                                      # h100.yaml:81-88
        vendorID: 10de
        deviceID: "2330"
        subsystemVendorID: 10de
        subsystemDeviceID: "1658"
        maxLink:
          generation: 5
          width: 16
      capabilities:
        mig:                                    # h100.yaml:305-308
          supported: true
          maxGPUInstances: 7
    topology:
      gpuSlots:                                 # h100.yaml:360-415, 466-481
        - index: 0
          pciAddress: "0000:1a:00.0"
          rootComplex: pci0000:00
          numaNode: 0
        - index: 1
          pciAddress: "0000:1b:00.0"
          rootComplex: pci0000:00
          numaNode: 0
        - index: 2
          pciAddress: "0000:4a:00.0"
          rootComplex: pci0000:00
          numaNode: 0
        - index: 3
          pciAddress: "0000:4b:00.0"
          rootComplex: pci0000:00
          numaNode: 0
        - index: 4
          pciAddress: "0000:8a:00.0"
          rootComplex: pci0000:80
          numaNode: 1
        - index: 5
          pciAddress: "0000:8b:00.0"
          rootComplex: pci0000:80
          numaNode: 1
        - index: 6
          pciAddress: "0000:ca:00.0"
          rootComplex: pci0000:80
          numaNode: 1
        - index: 7
          pciAddress: "0000:cb:00.0"
          rootComplex: pci0000:80
          numaNode: 1
      network:                                  # h100.yaml:443-455
        type: InfiniBand
        adapterModel: ConnectX-7
        firmwareVersion: 28.39.2048
        linkSpeedGbps: 400
        adaptersPerGPU: 1
  software:                                     # h100.yaml:10-15
    driverVersion: 550.163.01
    nvmlVersion: "12.550.163.01"
    cudaVersion: "12.4"
