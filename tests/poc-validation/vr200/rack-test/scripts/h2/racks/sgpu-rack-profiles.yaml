# SGPURackProfiles for the mokka-hetero KWOK tier.
#
# Every value is copied from the nvml-mock profile of the same type in the
# combined tree (.worktrees/rack-hetero @ 29cc7971,
# deployments/nvml-mock/helm/nvml-mock/profiles/<type>.yaml); the line cited
# after each block is where it comes from. Strings that the DRA driver also
# publishes (productName, architecture) use the driver's spelling so a
# SGPURack and a ResourceSlice read the same (architecture strings from
# go-nvlib v0.12.0 device.go:94-99 as vendored by dra-driver-nvidia-gpu v0.5.0).
#
# The control plane validates only the rack shape, GPU count, gpuSlots,
# gpuFabric and network (internal/sgpu/inventory/rack/materialize.go:64-131);
# model fields are free-form and never checked against anything.
#
# gpuSlots[].pciAddress is the lowercase BDF the DRA driver publishes as
# resource.kubernetes.io/pciBusID for the same GPU. The ResourceSlice clone
# (dra/clone-slices.sh) joins on it to take each fake GPU's UUID from the
# SGPURack, so it must stay identical to the real slice's pciBusID.
---
apiVersion: mokka.nvidia.com/v1alpha1
kind: SGPURackProfile
metadata:
  name: hetero-vr200-nvl72
spec:
  rack:
    nodesPerRack: 18
  node:
    gpus:
      count: 4                                  # vr200.yaml:423-479 (4 devices)
      model:
        vendor: NVIDIA
        product: VR200 NVL                      # vr200.yaml:1
        productName: NVIDIA Graphics Device     # vr200.yaml:48
        architecture: Rubin                     # vr200.yaml:65 "rubin" -> NVML 13 -> go-nvlib "Rubin"
        computeCapability:                      # vr200.yaml:66-68
          major: 10
          minor: 7
        board:
          partNumber: 699-2G558-3201-TS3        # vr200.yaml:51
        firmware:
          vbiosVersion: 99.00.1B.00.00          # vr200.yaml:52
          gspVersion: "615.23"                  # vr200.yaml:398
          infoROM:                              # vr200.yaml:105-108 (pwr_object absent)
            imageVersion: G558.0200.00.01
            oemObjectVersion: "2.1"
            eccObjectVersion: "7.16"
      memory:
        capacity: 288Gi                         # vr200.yaml:118 (309237645312 B)
        reserved: 1277Mi                        # vr200.yaml:119 (1339031552 B)
        bar1Capacity: 512Gi                     # vr200.yaml:125
        busWidthBits: 16384                     # vr200.yaml:122
      pci:                                      # vr200.yaml:133-139
        vendorID: 10de
        deviceID: 307f
        subsystemVendorID: 10de
        subsystemDeviceID: 221a
        maxLink:
          generation: 6
          width: 16
    topology:
      gpuSlots:                                 # vr200.yaml:440-479, 542-553
        - index: 0
          pciAddress: "0002:81:00.0"
          rootComplex: pci0002:80
          numaNode: 0
          hostProcessorIndex: 0
        - index: 1
          pciAddress: "0002:c1:00.0"
          rootComplex: pci0002:80
          numaNode: 0
          hostProcessorIndex: 0
        - index: 2
          pciAddress: "000a:81:00.0"
          rootComplex: pci000a:80
          numaNode: 1
          hostProcessorIndex: 1
        - index: 3
          pciAddress: "000a:e1:00.0"
          rootComplex: pci000a:80
          numaNode: 1
          hostProcessorIndex: 1
      gpuFabric:                                # vr200.yaml:492-511
        type: NVLink
        generation: 6
        linksPerGPU: 18
        bandwidthPerLinkMBps: 100000
        c2cSupported: true
        domain:
          scope: Rack
          gpuCount: 72                          # must equal 18 x 4 (materialize.go:115-122)
        switches:
          visiblePerNode: 4
      network:                                  # vr200.yaml:522-534
        type: InfiniBand
        adapterModel: ConnectX-9
        firmwareVersion: 82.50.1002
        linkSpeedGbps: 800
        adaptersPerGPU: 2
  software:                                     # vr200.yaml:23-25
    driverVersion: "615.23"
    nvmlVersion: "13.615.23"
    cudaVersion: "13.4"
---
